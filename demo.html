<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Show Curr Location</title>
		<script>
			function getMyLocation() {
				const para = document.querySelector("p");
				navigator.geolocation.getCurrentPosition(
					(position) => {
						para.innerText = `Your location: latitude->${position.coords.latitude},longitude->${position.coords.longitude}`;
					},
					(error) => {
						para.innerText = `Could not get the location ${error.message}`;
					}
				);
			}
		</script>
	</head>
	<body>
		<p id="details"></p>
		<button onclick="getMyLocation()">Show My Location</button>
	</body>
</html>
